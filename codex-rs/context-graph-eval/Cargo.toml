[package]
edition.workspace = true
license.workspace = true
name = "codex-context-graph-eval"
version.workspace = true

[lib]
doctest = false
name = "codex_context_graph_eval"
path = "src/lib.rs"

[[bin]]
name = "codex-context-graph-eval"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-context-graph = { workspace = true }
codex-context-graph-store = { workspace = true }
codex-rollout = { workspace = true }
codex-state = { workspace = true }
codex-utils-absolute-path = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
codex-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
